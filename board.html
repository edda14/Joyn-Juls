<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Board</title>
    <link rel="stylesheet" href="./css/navbar.css">
    <link rel="stylesheet" href="./css/header.css">
    <link rel="stylesheet" href="./css/board.css">
    <link rel="stylesheet" href="./css/addTask.css?v=20260826-2">
    <link rel="stylesheet" href="./css/boardOverlay.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com/" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@100..900&display=swap" rel="stylesheet">
    <link rel="shortcut icon" href="./assets/img/joinDark.png" type="image/x-icon" />
</head>

<body onload="initBoard(); addTaskInit()">
    <header w3-include-html="./template/header.html"></header>
    <aside>
      <div class="navbar">
        <img class="joinIcon" src="./assets/img/joinWhite.png" alt="Join Icon" />
        <div class="navbarContent">
          <div class="menu">
            <a id="summaryMenu" href="./summary.html" class="summery">
              <img src="./assets/img/summeryIcon.png" alt="Summary" />
              <p>Summary</p>
            </a>
            <a id="boardMenuResposive" href="./board.html" class="boardResposive currentPage">
              <img src="./assets/img/boardIcon.png" alt="Board" />
              <p>Board</p>
            </a>
            <a id="addTaskMenu" href="./addTask.html" class="addTask">
              <img src="./assets/img/addTask.png" alt="Add Task" />
              <p>Add Task</p>
            </a>
            <a id="boardMenu" href="./board.html" class="board currentPage">
              <img src="./assets/img/boardIcon.png" alt="Board" />
              <p>Board</p>
            </a>
            <a id="contactsMenu" href="./contacts.html" class="conntacts">
              <img src="./assets/img/contacktsIcon.png" alt="Contacts" />
              <p>Contacts</p>
            </a>
          </div>
          <div class="policy">
            <a id="privacyPolicyMenu" href="./privacyPolicy.html">Privacy Policy</a>
            <a id="legalNoticeMenu" href="./legalNotice.html">Legal notice</a>
          </div>
        </div>
      </div>
    </aside>
    <div class="main-content-wrapper">
        <main class="content">
            <section class="headerClass">
                <h2>Board</h2>
                <div class="search-and-add">
                    <div class="search-bar">
                        <input oninput="searchTasks()" type="search" placeholder="Search..." id="searchInput">
                        <button type="button" id="searchButton">Search</button>
                    </div>
                    <button onclick="showOverlay();stopPropagation(event)" class="addTaskButton"><span class="buttonText">Add task</span><div
                            class="addSymbol"></button>
                </div>
            </section>
            <section class="allTasks">
                <div class="todo">
                    <div class="tasksHeader">
                        <span>Triage</span>
                    </div>
                    <div id="triage" class="taskContent" ondrop="drop(event)" ondragover="allowDrop(event)">

                    </div>
                </div>
                <div class="todo">
                    <div class="tasksHeader">
                        <span>To do</span>
                    </div>
                    <div id="toDo" class="taskContent" ondrop="drop(event)" ondragover="allowDrop(event)">

                    </div>
                </div>
                <div class="todo">
                    <div class="tasksHeader">
                        <span>In progress</span>
                    </div>
                    <div id="progress" class="taskContent" ondrop="drop(event)" ondragover="allowDrop(event)">

                    </div>
                </div>
                <div class="todo">
                    <div class="tasksHeader">
                        <span>Await feedback</span>
                    </div>
                    <div id="feedback" class="taskContent" ondrop="drop(event)" ondragover="allowDrop(event)">

                    </div>
                </div>
                <div class="todo">
                    <div class="tasksHeader">
                        <span>Done</span>
                    </div>
                    <div id="done" class="taskContent" ondrop="drop(event)" ondragover="allowDrop(event)">

                    </div>
                </div>
            </section>
        </main>
        <div onclick="off()" id="overlay">
            <div class="overlayContent" onclick="stopPropagation(event)"></div>
        </div>
        <div onclick="offAddTask(event)" id="addTaskOverlay" class="overlay">
            <div class="overlayContentAddTask overlayContentAddTask-template" onclick="event.stopPropagation()">
                <div class="innerOverlay">                
                <div onclick="offAddTask(event, true)" class="closeButtonDiv"><img class="closeButtonAdd"
                        src="./assets/img/Close.png" alt=""></div>
                <div class="at-headline input-container-bordHTML-headline"><div>Add Task</div></div>
                <form id="board-edit-task-main-input" class="main-input-container input-container-bordHTML"
                    w3-include-html="./template/addTaskTemplate.html"></form>
                </div>
            </div>
        </div>
        <div class="bg-confirmation-task-creation" id="bg-task-added-note">
            <div class="confirmation-task-creation-hidden" id="task-added-note">
                <div>Task added to Board</div><img src="./assets/img/boardIcon.png" alt="">
            </div>
        </div>
        <script src="https://www.gstatic.com/firebasejs/12.18.0/firebase-app-compat.js"></script>
        <script src="https://www.gstatic.com/firebasejs/12.18.0/firebase-auth-compat.js"></script>
        <script src="./js/firebase.js"></script>
        <script src="./js/board.js?v=20260826" defer></script>
        <script src="./js/template.js"></script>
        <script src="./js/contacts.js"></script>
        <script src="./js/storage.js"></script>
        <script src="./js/addTask.js"></script>
        <script src="./js/dragDrop.js"></script>
</body>

</html>
